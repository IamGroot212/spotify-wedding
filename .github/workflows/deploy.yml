name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm exec nuxt build

      - name: Deploy
        run: |
          rsync -a --delete .output/ /home/febec/Programming/claude/spotify-wedding/.output/
          sudo /usr/bin/systemctl restart spotify-wedding

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:3002/api/admin/session > /dev/null
          echo "Health check passed"

      - name: API tests
        run: pnpm test

      - name: Cleanup test data
        run: node /home/febec/Programming/claude/spotify-wedding/scripts/cleanup-test-data.mjs
