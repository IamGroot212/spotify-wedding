name: Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm exec nuxt build

      - name: Diagnose service
        continue-on-error: true
        run: |
          # Public repo: only print non-secret facts (no ExecStart args, no env values)
          systemctl show spotify-wedding -p WorkingDirectory -p EnvironmentFiles -p User --no-pager
          NODE_BIN=$(systemctl show spotify-wedding -p ExecStart --value | grep -o 'path=[^ ;]*' | cut -d= -f2)
          echo "service binary: ${NODE_BIN:-unknown} ($(${NODE_BIN:-false} -v 2>/dev/null || echo n/a))"
          df -h /home | tail -1
          { journalctl -u spotify-wedding -n 200 --no-pager 2>/dev/null || sudo -n journalctl -u spotify-wedding -n 200 --no-pager 2>/dev/null; } \
            | grep -iE 'error|cannot|module|sqlite|ENOENT|EACCES|ENOSPC' | tail -20 || echo "no journal access or no errors"

      - name: Sync admin password
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$ADMIN_PASSWORD" || { echo "Secret ADMIN_PASSWORD is missing"; exit 1; }
          ENV_FILE=$(systemctl show spotify-wedding -p EnvironmentFiles --value | awk '{print $1}')
          echo "EnvironmentFile: ${ENV_FILE:-none}"
          test -n "$ENV_FILE" && test -w "$ENV_FILE" || { echo "Env file not found or not writable"; exit 1; }
          if grep -q '^NUXT_ADMIN_PASSWORD=' "$ENV_FILE"; then
            sed -i "s|^NUXT_ADMIN_PASSWORD=.*|NUXT_ADMIN_PASSWORD=${ADMIN_PASSWORD}|" "$ENV_FILE"
          else
            echo "NUXT_ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$ENV_FILE"
          fi

      - name: Deploy
        run: |
          rsync -a --delete .output/ /home/febec/Programming/claude/spotify-wedding/.output/
          sudo /usr/bin/systemctl restart spotify-wedding

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:3002/api/admin/session > /dev/null
          echo "Health check passed"

      - name: API tests
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: pnpm test

      - name: Cleanup test data
        run: node scripts/cleanup-test-data.mjs
