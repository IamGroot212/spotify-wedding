name: Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: [self-hosted, pi]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Build with the same Node as the systemd service (/usr/bin/node), otherwise
      # better-sqlite3's native module fails to load ("Module did not self-register").
      - name: Detect service Node version
        id: sysnode
        run: echo "version=$(/usr/bin/node -v)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.sysnode.outputs.version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm exec nuxt build

      - name: Sync admin password
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$ADMIN_PASSWORD" || { echo "Secret ADMIN_PASSWORD is missing"; exit 1; }
          ENV_FILE=$(systemctl show spotify-wedding -p EnvironmentFiles --value | awk '{print $1}')
          echo "EnvironmentFile: ${ENV_FILE:-none}"
          test -n "$ENV_FILE" && test -w "$ENV_FILE" || { echo "Env file not found or not writable"; exit 1; }
          if grep -q '^NUXT_ADMIN_PASSWORD=' "$ENV_FILE"; then
            sed -i "s|^NUXT_ADMIN_PASSWORD=.*|NUXT_ADMIN_PASSWORD=${ADMIN_PASSWORD}|" "$ENV_FILE"
          else
            echo "NUXT_ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> "$ENV_FILE"
          fi

      - name: Deploy
        run: |
          rsync -a --delete .output/ /home/febec/Programming/claude/spotify-wedding/.output/
          sudo /usr/bin/systemctl restart spotify-wedding

      - name: Health check
        run: |
          sleep 3
          curl -sf http://127.0.0.1:3002/api/admin/session > /dev/null
          echo "Health check passed"

      - name: API tests
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: pnpm test

      - name: Cleanup test data
        run: node scripts/cleanup-test-data.mjs
